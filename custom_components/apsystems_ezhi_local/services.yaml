set_power:
  name: Set output power
  description: >-
    Set the grid setpoint of the APsystems EZHI inverter. Positive discharges
    to the grid, negative charges from it. Only takes effect in the Local
    system mode — in the other modes the inverter answers SUCCESS and keeps
    running its own strategy, so the call is refused there with an error
    instead of being sent. Needs the control layer to know the mode.
  fields:
    device_id:
      name: Device
      description: >-
        Which inverter. Optional when only one is set up; required when several
        are, because this call will not pick one for you.
      required: false
      selector:
        device:
          integration: apsystems_ezhi_local
    power:
      name: Power
      description: Power in watts
      required: true
      example: 600
      selector:
        number:
          min: -1200
          max: 1200
          step: 10
          unit_of_measurement: W

set_high_power_mode:
  name: Set high power mode
  description: >-
    Switch the EZHI output ceiling between 800 W (standard) and 1200 W (high
    power). DISCLAIMER, quoted from the APsystems app: enabling high power mode
    "may cause the device output to exceed regulatory limits for grid
    connection. Any legal risks, safety incidents, or other consequences
    arising therefrom shall be solely your responsibility." This is a service
    rather than a switch entity so that enabling it cannot happen with one
    stray tap on a dashboard.
  fields:
    device_id:
      name: Device
      description: >-
        Which inverter. Optional when only one is set up; required when several
        are -- raising a regulatory ceiling on a device you did not mean is
        exactly what this field prevents.
      required: false
      selector:
        device:
          integration: apsystems_ezhi_local
    enable:
      name: Enable high power mode
      description: On sets the ceiling to 1200 W, off returns it to 800 W.
      required: true
      selector:
        boolean:
    acknowledge_regulatory_risk:
      name: I accept the regulatory risk
      description: >-
        Required when enabling. Confirms you have read the disclaimer above and
        accept responsibility for operating above the standard 800 W ceiling.
        Not needed when switching back down to 800 W.
      required: false
      default: false
      selector:
        boolean:

ble_raw_get:
  name: BLE raw get (diagnostic)
  description: >-
    Read one get-identifier over whichever local control transport is active
    and log the raw reply at WARNING. Diagnostic tool: the default identifier
    `outputData` returns pcsOriginalData and pvOriginalData, the raw inverter
    frames the local HTTP API does not expose. Works on Bluetooth and on local
    MQTT; on the cloud transport there is no such read.
  fields:
    device_id:
      name: Device
      description: >-
        Which inverter. Optional when only one is set up; required when several
        are.
      required: false
      selector:
        device:
          integration: apsystems_ezhi_local
    identifier:
      name: Identifier
      description: >-
        The get-identifier to request (outputData, deviceInfo, si, meterStatus,
        light, bindDevice, systemMode).
      required: false
      default: outputData
      example: outputData
      selector:
        text:

local_control_enable:
  name: Enable Local Control
  description: >-
    Put the smart meter and the inverter into one Local Control group: from
    then on the inverter reads the meter itself and holds the grid draw at the
    offset, with or without Home Assistant. Needs the local MQTT transport and
    the smart meter's id in the options. The inverter is put into Balcony
    Storage mode (the group lives there) and stays in it when the group is
    dissolved again.
  fields:
    device_id:
      name: Device
      description: >-
        Which inverter. Optional when only one is set up; required when several
        are.
      required: false
      selector:
        device:
          integration: apsystems_ezhi_local
    offset:
      name: Offset
      description: >-
        How much grid draw the inverter leaves standing, in watts (0 to 120 --
        10 % of the 1200 W group, the limit of the vendor app). Remembered for
        the Local Control switch. Leave empty to use the stored value.
      required: false
      example: 30
      selector:
        number:
          min: 0
          max: 120
          step: 1
          unit_of_measurement: W
    wait:
      name: Wait until it regulates
      description: >-
        Keep the call open until the inverter reports readings from the meter
        (about 30 s) and fail if it never does. Off returns as soon as both
        devices accepted their command.
      required: false
      default: true
      selector:
        boolean:

local_control_disable:
  name: Disable Local Control
  description: >-
    Dissolve the Local Control group: the inverter first, then the meter. The
    inverter's output stops with its half.
  fields:
    device_id:
      name: Device
      description: >-
        Which inverter. Optional when only one is set up; required when several
        are.
      required: false
      selector:
        device:
          integration: apsystems_ezhi_local
